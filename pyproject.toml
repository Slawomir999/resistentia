[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resistentia"
version = "0.1.0"
description = "Response termination for autonomous systems. Activation is solved; stopping is not."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Sławomir Wyciślak" }]
keywords = ["anomaly-detection", "alerting", "control", "artificial-immune-systems",
            "observability", "agents", "supply-chain", "cold-chain"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: System :: Monitoring",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/CHANGEME/resistentia"
Specification = "https://github.com/CHANGEME/resistentia/blob/main/SPEC.md"

[tool.hatch.build.targets.wheel]
packages = ["src/resistentia"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
